name: rapistock
description: Inventario simple para tiendas en Colombia.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  http: ^1.2.2
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#1B4D3E"
  adaptive_icon_foreground: assets/logo.png